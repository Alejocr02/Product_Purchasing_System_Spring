spring:
  application:
    name: product-purchase-system
    datasource:
      url: jdbc:mysql://${DB_HOST:localhost]:${DB_PORT:3306}/${DB_NAME:pps_db}?useSSL=false&serverTimezone=UTC&allowedPublicKeyRetrieval=true
      username: ${DB_USER:user_pps}
      password: ${DB_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
      hibernate:
        ddl-auto: ${DDL_AUTO:update}
      open-in-view: false
      show-sql: ${DB_SHOW_SQL:false}
      properties:
        hibernate:
          format_sql: true
          use_sql_comments: true
          dialect: org.hibernate.dialect.MySQL8Dialect}
  sql:
    init:
      mode: never

